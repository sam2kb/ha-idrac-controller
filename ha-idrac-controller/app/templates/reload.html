<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reload app</title>
    <link rel="stylesheet" href="../static/style.css">
    <script src="../static/reload.js" defer></script>
</head>
<body>
    <main class="container" id="reload-app" data-boot-id="{{ boot_id }}" data-reload-token="{{ reload_token }}">
        <h1>Reload app</h1>
        <p id="reload-message" role="status">Configuration saved. Reloading the app…</p>
        <p>This restarts HA iDRAC Controller. Home Assistant and your servers keep running.</p>
        <p><a href="../servers">Back to Manage Servers</a></p>
        <noscript>JavaScript is needed to reload here. You can restart the app from Home Assistant Settings.</noscript>
    </main>
</body>
</html>
