# HA iDRAC Controller/config.yaml

name: "HA iDRAC Controller"
version: "1.0.11"
slug: "ha_idrac_controller"
description: "Monitor and control Dell PowerEdge servers through iDRAC over IPMI."
url: "https://github.com/sam2kb/ha-idrac-controller"
arch:
  - "aarch64"
  - "amd64"
boot: "auto"
timeout: 60
watchdog: "http://[HOST]:[PORT:8099]/health"
services:
  - mqtt:want

ingress: true
ingress_port: 8099
ingress_entry: "/"
panel_icon: "mdi:server-network"
panel_title: "iDRAC Control"
panel_admin: true

options:
  # Custom fan-mode defaults. Ignored by Dell automatic mode.
  base_fan_speed_percent: 20
  low_temp_threshold: 45
  high_temp_fan_speed_percent: 50
  critical_temp_threshold: 65

  # Polling and Logging
  check_interval_seconds: 30
  log_level: "info"

  # MQTT: leave host and credentials empty for automatic Supervisor setup
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""

schema:
  # Custom fan-mode defaults
  base_fan_speed_percent: "int(5,100)"
  low_temp_threshold: "int(0,100)"
  high_temp_fan_speed_percent: "int(5,100)"
  critical_temp_threshold: "int(0,100)"

  # Polling and Logging
  check_interval_seconds: "int(5,)"
  log_level: "list(trace|debug|info|notice|warning|error|fatal)"

  # MQTT Configuration
  mqtt_host: "str?"
  mqtt_port: "port"
  mqtt_username: "str?"
  mqtt_password: "password?"

backup_exclude:
  - "current_status.json"
