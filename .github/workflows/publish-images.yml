name: Publish container images

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'sam2kb/ha-idrac-controller'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate image version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          config = Path("ha-idrac-controller/config.yaml").read_text()
          version = re.search(r'^version: "([0-9]+\.[0-9]+\.[0-9]+)"$', config, re.M).group(1)
          if os.environ["REF_TYPE"] == "tag" and os.environ["REF_NAME"] != "v" + version:
              raise SystemExit("Release tag must match config.yaml version")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("version=" + version + "\n")
          PY

  tests:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install pytest -r ha-idrac-controller/app/requirements.txt
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test tests/*.cjs

  build:
    needs: [prepare, tests]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-24.04
          - arch: aarch64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE: ghcr.io/sam2kb/ha-idrac-controller
      VERSION: ${{ needs.prepare.outputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and sign native image
        uses: home-assistant/builder/actions/build-image@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: ./ha-idrac-controller
          image: ghcr.io/sam2kb/ha-idrac-controller
          image-tags: ${{ needs.prepare.outputs.version }}-${{ matrix.arch }}
          skip-existing: ${{ needs.prepare.outputs.version }}-${{ matrix.arch }}
          cache-gha-scope: ha-idrac-controller
          labels: |
            io.hass.type=app
            io.hass.name=HA iDRAC Controller
            io.hass.description=Monitor and control Dell PowerEdge servers through iDRAC over IPMI.
            io.hass.url=https://github.com/sam2kb/ha-idrac-controller
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.revision=${{ github.sha }}
          push: "true"
          version: ${{ needs.prepare.outputs.version }}
      - name: Smoke test published image without network access
        run: bash .github/scripts/smoke-image.sh "$IMAGE:$VERSION-$ARCH" "$ARCH"

  manifest:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      id-token: write
    env:
      IMAGE: ghcr.io/sam2kb/ha-idrac-controller
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Publish version only after both native smoke tests pass
        run: |
          if ! docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            docker buildx imagetools create --tag "$IMAGE:$VERSION" \
              "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-aarch64"
          fi
          docker buildx imagetools inspect "$IMAGE:$VERSION" --raw > manifest.json
          python3 - <<'PY'
          import json
          manifest = json.load(open("manifest.json"))
          actual = {(m["platform"]["os"], m["platform"]["architecture"])
                    for m in manifest["manifests"] if m["platform"]["os"] != "unknown"}
          assert actual == {("linux", "amd64"), ("linux", "arm64")}, actual
          PY
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest.Digest}}' | tr -d '"')
          cosign sign --yes "$IMAGE@$digest"
          echo "Published $IMAGE:$VERSION (amd64, arm64)" >> "$GITHUB_STEP_SUMMARY"
